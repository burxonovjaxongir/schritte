<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F3F4F6; min-height: 100vh; min-height: -webkit-fill-available; overscroll-behavior: none; }

/* SPLASH / INSTALL PROMPT */
#install-banner { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #312E81; color: #fff; padding: 12px 20px; border-radius: 14px; font-size: 14px; font-weight: 600; z-index: 9999; box-shadow: 0 4px 20px rgba(0,0,0,.3); cursor: pointer; white-space: nowrap; gap: 10px; align-items: center; }
#install-banner.show { display: flex; }
#install-banner .close { margin-left: 8px; opacity: .7; font-size: 16px; }

/* HEADER */
.header { background: #1E1B4B; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.header-icon { font-size: 22px; flex-shrink: 0; }
.header-title { flex: 1; min-width: 0; }
.header h1 { color: #C7D2FE; font-size: 16px; font-weight: 700; }
.header .sub { color: #6366F1; font-size: 11px; margin-top: 1px; }
.header-stats { color: #A5B4FC; font-size: 11px; text-align: right; flex-shrink: 0; }
.header-stats span { color: #FCD34D; font-weight: 700; }

/* LEVEL BAR */
.level-bar { display: flex; gap: 6px; padding: 8px 14px; background: #312E81; overflow-x: auto; position: sticky; top: 56px; z-index: 99; scrollbar-width: none; }
.level-bar::-webkit-scrollbar { display: none; }
.level-tab { padding: 6px 12px; border-radius: 14px; border: 1.5px solid transparent; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: all .15s; color: #A5B4FC; background: #3730A3; flex-shrink: 0; }
.level-tab.active { color: #fff; }
.level-tab[data-lv="A1.1"].active { background: #1D4ED8; border-color: #60A5FA; }
.level-tab[data-lv="A1.2"].active { background: #0369A1; border-color: #38BDF8; }
.level-tab[data-lv="A2.1"].active { background: #15803D; border-color: #4ADE80; }
.level-tab[data-lv="A2.2"].active { background: #065F46; border-color: #34D399; }
.level-tab[data-lv="B1.1"].active { background: #854D0E; border-color: #FBBF24; }
.level-tab[data-lv="B1.2"].active { background: #9A3412; border-color: #FB923C; }

/* SEARCH */
.search-bar { background: #312E81; padding: 6px 14px 10px; position: sticky; top: 100px; z-index: 98; }
.search-bar input { width: 100%; background: #4338CA; border: none; border-radius: 10px; padding: 9px 14px; color: #E0E7FF; font-size: 14px; outline: none; }
.search-bar input::placeholder { color: #818CF8; }

/* MODE BAR */
.mode-bar { display: flex; gap: 5px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #E5E7EB; overflow-x: auto; position: sticky; top: 148px; z-index: 97; scrollbar-width: none; }
.mode-bar::-webkit-scrollbar { display: none; }
.mode-btn { padding: 7px 12px; border-radius: 20px; border: 1.5px solid #E5E7EB; background: #fff; font-size: 12px; cursor: pointer; white-space: nowrap; color: #374151; font-weight: 500; transition: all .15s; flex-shrink: 0; }
.mode-btn.active { background: #1E1B4B; color: #C7D2FE; border-color: #1E1B4B; }

/* VIEWS */
#view-sections, #view-cards, #view-quiz, #view-gap, #view-list, #view-stats { display: none; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
#view-sections.active, #view-cards.active, #view-quiz.active, #view-gap.active, #view-list.active, #view-stats.active { display: block; }

/* SECTIONS */
.sections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; padding: 12px; }
.sec-card { border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: transform .1s, box-shadow .1s; border: 1.5px solid transparent; active-scale: 0.97; }
.sec-card:active { transform: scale(0.97); }
.sec-card .num { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .6; }
.sec-card .name { font-size: 13px; font-weight: 700; margin: 3px 0 2px; line-height: 1.3; }
.sec-card .count { font-size: 11px; opacity: .6; }
.sec-card .prog-bar { height: 3px; background: rgba(0,0,0,.1); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.sec-card .prog-fill { height: 100%; border-radius: 2px; transition: width .3s; }

/* CARDS */
.flashcard-wrap { padding: 12px; max-width: 500px; margin: 0 auto; }
.fc-sec-title { text-align: center; font-size: 12px; color: #9CA3AF; margin-bottom: 8px; font-weight: 500; }
.fc-progress { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.fc-progress-bar { flex: 1; height: 5px; background: #E5E7EB; border-radius: 3px; overflow: hidden; }
.fc-progress-fill { height: 100%; border-radius: 3px; transition: width .3s; }
.fc-progress-text { font-size: 12px; color: #9CA3AF; white-space: nowrap; }
.flashcard { border-radius: 18px; border: 2px solid #E5E7EB; background: #fff; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 24px 20px; text-align: center; user-select: none; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.flashcard:active { transform: scale(0.99); }
.flashcard .fc-hint { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 14px; opacity: .4; }
.flashcard .fc-word { font-size: 22px; font-weight: 700; line-height: 1.3; }
.flashcard .fc-sub { font-size: 15px; color: #374151; margin-top: 10px; display: none; font-weight: 600; }
.flashcard .fc-ex { font-size: 12px; color: #9CA3AF; margin-top: 10px; font-style: italic; display: none; line-height: 1.5; border-top: 1px solid #F3F4F6; padding-top: 10px; }
.flashcard.revealed .fc-sub, .flashcard.revealed .fc-ex { display: block; }
.flashcard .fc-tap { font-size: 12px; color: #C7D2FE; margin-top: 16px; background: #EEF2FF; padding: 6px 14px; border-radius: 20px; }
.flashcard.revealed .fc-tap { display: none; }
.fc-result-btns { display: none; gap: 10px; margin-top: 10px; }
.fc-result-btns.show { display: flex; }
.res-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
.res-btn.known { background: #DCFCE7; color: #166534; }
.res-btn.unknown { background: #FEE2E2; color: #991B1B; }
.fc-nav { display: flex; gap: 8px; margin-top: 10px; }
.fc-btn { flex: 1; padding: 13px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
.fc-btn.prev { background: #F3F4F6; color: #374151; }
.fc-btn.flip { background: #1E1B4B; color: #C7D2FE; }
.fc-btn.next { background: #1E1B4B; color: #fff; }

/* QUIZ */
.quiz-wrap { padding: 12px; max-width: 500px; margin: 0 auto; }
.quiz-sec-select { padding: 12px; max-width: 500px; margin: 0 auto; }
.quiz-sec-btn { display: block; width: 100%; text-align: left; padding: 13px 16px; margin-bottom: 8px; border-radius: 12px; border: 1.5px solid #E5E7EB; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
.quiz-sec-btn:active { background: #F3F4F6; }
.quiz-q { background: #1E1B4B; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 12px; }
.quiz-q .q-label { color: #6366F1; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
.quiz-q .q-word { color: #FCD34D; font-size: 22px; font-weight: 700; line-height: 1.3; }
.quiz-q .q-ex { color: #A5B4FC; font-size: 12px; margin-top: 8px; font-style: italic; }
.quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quiz-opt { padding: 14px 8px; border-radius: 12px; border: 2px solid #E5E7EB; background: #fff; font-size: 13px; cursor: pointer; text-align: center; font-weight: 600; line-height: 1.3; transition: all .1s; }
.quiz-opt:active { transform: scale(0.97); }
.quiz-opt.correct { background: #DCFCE7; border-color: #22C55E; color: #166534; }
.quiz-opt.wrong { background: #FEE2E2; border-color: #EF4444; color: #991B1B; }
.quiz-score { text-align: center; padding: 8px; font-size: 14px; color: #6B7280; }
.quiz-score span { color: #111827; font-weight: 700; }
.quiz-next { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #1E1B4B; color: #C7D2FE; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; display: none; }
.quiz-next.show { display: block; }

/* GAP */
.gap-wrap { padding: 12px; max-width: 500px; margin: 0 auto; }
.gap-q { background: #1E1B4B; border-radius: 16px; padding: 20px; margin-bottom: 12px; }

.speak-btn { background: #312E81; border: none; border-radius: 8px; padding: 4px 10px; color: #A5B4FC; font-size: 13px; cursor: pointer; margin-left: 6px; }

const LEVEL_COLORS = {
  'A1.1': {tab:'#1D4ED8'}, 'A1.2': {tab:'#0369A1'},
  'A2.1': {tab:'#15803D'}, 'A2.2': {tab:'#065F46'},
  'B1.1': {tab:'#854D0E'}, 'B1.2': {tab:'#9A3412'},
};

let currentLevelIdx = 0;
let DATA = ALL_LEVELS[0].sections;
let currentMode = 'sections';
let currentSectionIdx = 0;
let currentWordIdx = 0;
let cardRevealed = false;
let knownWords = new Set();
let unknownWords = new Set();
let quizScope = null, quizScore = 0, quizTotal = 0, quizCurrentWord = null;
let gapScope = null, gapScore = 0, gapTotal = 0, gapCurrent = null, gapAnswered = false;
let flatWords = [];

function rebuildFlat() {
  flatWords = [];
  DATA.forEach(sec => sec.words.forEach((w,wi) => {
    flatWords.push({de:w[0],uz:w[1],ex:w[2],sec:sec.title,secId:sec.id,wordIdx:wi});
  }));
}

function storageKey() { return 'schritte_pwa_'+ALL_LEVELS[currentLevelIdx].level.replace('.',''); }

function loadProgress() {
  try {
    const raw = localStorage.getItem(storageKey());
    if(raw) {
      const obj = JSON.parse(raw);
      (obj.known||[]).forEach(k=>knownWords.add(k));
      (obj.unknown||[]).forEach(k=>unknownWords.add(k));
    }
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify({
      known: Array.from(knownWords), unknown: Array.from(unknownWords)
    }));
  } catch(e) {}
}

// Level bar
function initLevelBar() {
  const bar = document.getElementById('level-bar');
  bar.innerHTML = ALL_LEVELS.map((lv,i) => {
    const total = lv.sections.reduce((a,s)=>a+s.words.length,0);
    return `<button class="level-tab${i===0?' active':''}" data-lv="${lv.level}" onclick="switchLevel(${i})">${lv.level}<br><span style="font-size:10px;opacity:.7">${total}</span></button>`;
  }).join('');
}

function switchLevel(idx) {
  if(idx===currentLevelIdx) return;
  saveProgress();
  currentLevelIdx=idx; DATA=ALL_LEVELS[idx].sections;
  knownWords=new Set(); unknownWords=new Set();
  loadProgress(); rebuildFlat();
  document.querySelectorAll('.level-tab').forEach((b,i)=>b.classList.toggle('active',i===idx));
  document.getElementById('level-name').textContent=ALL_LEVELS[idx].level;
  document.getElementById('total-count').textContent=flatWords.length;
  quizScope=null; quizScore=0; quizTotal=0;
  gapScope=null; gapScore=0; gapTotal=0;
  currentSectionIdx=0; currentWordIdx=0;
  if(currentMode==='cards') currentMode='sections';
  setMode(currentMode);
}

function setMode(mode) {
  currentMode=mode;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+mode).classList.add('active');
  document.querySelectorAll('#view-sections,#view-cards,#view-quiz,#view-gap,#view-list,#view-stats').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+mode).classList.add('active');
  if(mode==='sections') renderSections();
  else if(mode==='cards') renderCards(currentSectionIdx,currentWordIdx);
  else if(mode==='quiz') renderQuizSelect();
  else if(mode==='gap') renderGapSelect();
  else if(mode==='stats') renderStats();
  else if(mode==='list') renderList();
}

// SECTIONS
function countKnown(words,secId) {
  let k=0; words.forEach((_,i)=>{if(knownWords.has(secId+'_'+i))k++}); return k;
}

function renderSections(filter='') {
  const q=filter.toLowerCase();
  let html='<div class="sections-grid">';
  DATA.forEach((sec,i)=>{
    if(q&&!sec.title.toLowerCase().includes(q)&&!sec.words.some(w=>w[0].toLowerCase().includes(q)||w[1].toLowerCase().includes(q))) return;
    const k=countKnown(sec.words,sec.id);
    const pct=sec.words.length?Math.round(k/sec.words.length*100):0;
    html+=`<div class="sec-card" style="background:${sec.light};border-color:${sec.color}40" onclick="openSection(${i})">
      <div class="num" style="color:${sec.color}">Bo'lim ${sec.id}</div>
      <div class="name" style="color:${sec.color}">${sec.title}</div>
      <div class="count" style="color:${sec.color}">${sec.words.length} so'z${k>0?' · '+pct+'%':''}</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${sec.color}"></div></div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('view-sections').innerHTML=html||`<div class="empty-state"><div class="icon">🔍</div>Natija topilmadi</div>`;
}

function openSection(i) { currentSectionIdx=i; currentWordIdx=0; setMode('cards'); }

// CARDS
function renderCards(si,wi) {
  currentSectionIdx=si; currentWordIdx=wi; cardRevealed=false;
  const sec=DATA[si]; const w=sec.words[wi];
  const pct=Math.round(((wi+1)/sec.words.length)*100);
  document.getElementById('view-cards').innerHTML=`
    <div class="flashcard-wrap">
      <button class="back-btn" onclick="setMode('sections')">← Bo'limlarga</button>
      <div class="fc-sec-title">${sec.title}</div>
      <div class="fc-progress">
        <div class="fc-progress-bar"><div class="fc-progress-fill" style="width:${pct}%;background:${sec.color}"></div></div>
        <div class="fc-progress-text">${wi+1} / ${sec.words.length}</div>
      </div>
      <div class="flashcard" id="flashcard" onclick="flipCard()" style="border-color:${sec.color}40">
        <div class="fc-hint">Nemischa so'z</div>
        <div class="fc-word" style="color:${sec.color}">${w[0]}</div>
        <div class="fc-sub">${w[1]}</div>
        <div class="fc-ex">💬 "${w[2]}"</div>
        <div class="fc-tap">👆 Javobni ko'rish</div>
      </div>
      <div class="fc-result-btns" id="result-btns">
        <button class="res-btn unknown" onclick="markWord(false)">😕 Bilmadim</button>
        <button class="res-btn known" onclick="markWord(true)">✅ Bildim</button>
      </div>
      <div class="fc-nav">
        <button class="fc-btn prev" onclick="prevCard()">←</button>
        <button class="fc-btn flip" onclick="flipCard()">🔄 Ko'rsat</button>
        <button class="fc-btn next" onclick="nextCard()">→</button>
      </div>
    </div>`;
}

function flipCard() {
  cardRevealed=!cardRevealed;
  document.getElementById('flashcard').classList.toggle('revealed',cardRevealed);
  document.getElementById('result-btns').classList.toggle('show',cardRevealed);
}

function markWord(known) {
  const key=DATA[currentSectionIdx].id+'_'+currentWordIdx;
  if(known){knownWords.add(key);unknownWords.delete(key);}
  else{unknownWords.add(key);knownWords.delete(key);}
  saveProgress(); nextCard();
}

function nextCard() {
  const sec=DATA[currentSectionIdx];
  if(currentWordIdx<sec.words.length-1) renderCards(currentSectionIdx,currentWordIdx+1);
  else if(currentSectionIdx<DATA.length-1) renderCards(currentSectionIdx+1,0);
  else renderCards(0,0);
}

function prevCard() {
  if(currentWordIdx>0) renderCards(currentSectionIdx,currentWordIdx-1);
  else if(currentSectionIdx>0){const p=DATA[currentSectionIdx-1];renderCards(currentSectionIdx-1,p.words.length-1);}
}

// QUIZ
function renderQuizSelect() {
  let html='<div class="quiz-sec-select">';
  html+=`<button class="quiz-sec-btn" style="border-color:#1E1B4B" onclick="startQuiz(null)">🌐 Barcha bo'limlar (${flatWords.length} so'z)</button>`;
  DATA.forEach((sec,i)=>{html+=`<button class="quiz-sec-btn" style="border-color:${sec.color};color:${sec.color}" onclick="startQuiz(${i})">${sec.title} (${sec.words.length})</button>`;}); 
  html+='</div>';
  document.getElementById('view-quiz').innerHTML=html;
}

function startQuiz(idx){quizScope=idx;quizScore=0;quizTotal=0;renderQuiz();}

function getPool(){
  if(quizScope===null) return flatWords;
  return DATA[quizScope].words.map((w,wi)=>{return {de:w[0],uz:w[1],ex:w[2],secId:DATA[quizScope].id,wordIdx:wi}});
}

function renderQuiz() {
  const pool=getPool();
  const ri=Math.floor(Math.random()*pool.length);
  quizCurrentWord=pool[ri];
  const wrongs=[];
  while(wrongs.length<3&&wrongs.length<pool.length-1){
    const w=pool[Math.floor(Math.random()*pool.length)];
    if(w.uz!==quizCurrentWord.uz&&!wrongs.find(o=>o.uz===w.uz)) wrongs.push(w);
  }
  const opts=[quizCurrentWord,...wrongs].sort(()=>Math.random()-.5);
  document.getElementById('view-quiz').innerHTML=`
    <div class="quiz-wrap">
      <button class="back-btn" onclick="renderQuizSelect()">← Bo'lim tanlash</button>
      <div class="quiz-score">To'g'ri: <span>${quizScore}</span> / <span>${quizTotal}</span></div>
      <div class="quiz-q">
        <div class="q-label">O'zbekchasi nima?</div>
        <div class="q-word">${quizCurrentWord.de}</div>
        <div class="q-ex">${quizCurrentWord.ex||''}</div>
      </div>
      <div class="quiz-options">
        ${opts.map(o=>`<button class="quiz-opt" onclick="checkQ(this,'${o.uz.replace(/'/g,"\\'")}',${JSON.stringify(quizCurrentWord.uz)})">${o.uz}</button>`).join('')}
      </div>
      <button class="quiz-next" id="quiz-next" onclick="renderQuiz()">Keyingi →</button>
    </div>`;
}

function checkQ(btn,chosen,correct){
  quizTotal++;
  document.querySelectorAll('#view-quiz .quiz-opt').forEach(b=>b.onclick=null);
  const key=quizCurrentWord.secId+'_'+quizCurrentWord.wordIdx;
  if(chosen===correct){btn.classList.add('correct');quizScore++;knownWords.add(key);unknownWords.delete(key);}
  else{btn.classList.add('wrong');unknownWords.add(key);knownWords.delete(key);document.querySelectorAll('#view-quiz .quiz-opt').forEach(b=>{if(b.textContent.trim()===correct)b.classList.add('correct')});}
  saveProgress();
  document.querySelector('#view-quiz .quiz-score').innerHTML=`To'g'ri: <span>${quizScore}</span> / <span>${quizTotal}</span>`;
  document.getElementById('quiz-next').classList.add('show');
}

// GAP
function coreWord(de){
  let s=de.replace(/\([^)]*\)/g,'').split(',')[0].split('/')[0].trim();
  return s.replace(/^(der|die|das|dem|den|des|sich)\s+/i,'').trim();
}

function findBlank(de,ex){
  if(!ex) return null;
  const core=coreWord(de);
  if(!core||core.length<2) return null;
  const coreLow=core.toLowerCase();
  const tokens=ex.match(/[A-Za-z\u00C0-\u024F]+/g)||[];
  if(!tokens.length) return null;
  let match=tokens.find(t=>t.toLowerCase()===coreLow);
  if(!match){
    const stem=coreLow.slice(0,Math.max(3,Math.min(coreLow.length-1,5)));
    const cands=tokens.filter(t=>t.toLowerCase().startsWith(stem)&&t.length>=3);
    if(cands.length){cands.sort((a,b)=>Math.abs(a.length-core.length)-Math.abs(b.length-core.length));match=cands[0];}
  }
  if(!match) return null;
  const idx=ex.indexOf(match);
  if(idx===-1) return null;
  return {blanked:ex.slice(0,idx)+'<span class="blank">_____</span>'+ex.slice(idx+match.length),answer:match};
}

function buildGapPool(secIdx){
  const src=secIdx===null?flatWords:DATA[secIdx].words.map((w,wi)=>{return {de:w[0],uz:w[1],ex:w[2],secId:DATA[secIdx].id,wordIdx:wi}});
  return src.reduce((pool,w)=>{
    const r=findBlank(w.de,w.ex);
    if(r) pool.push({de:w.de,uz:w.uz,blanked:r.blanked,answer:r.answer,full:w.ex,secId:w.secId,wordIdx:w.wordIdx});
    return pool;
  },[]);
}

function speakText(text){
  if(!('speechSynthesis' in window)||!text) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='de-DE'; u.rate=0.9;
  window.speechSynthesis.speak(u);
}

function renderGapSelect(){
  const allPool=buildGapPool(null);
  let html='<div class="quiz-sec-select">';
  html+=`<button class="quiz-sec-btn" style="border-color:#1E1B4B" onclick="startGap(null)">🌐 Barcha bo'limlar (${allPool.length} ta gap)</button>`;
  DATA.forEach((sec,i)=>{
    const p=buildGapPool(i);
    if(!p.length) return;
    html+=`<button class="quiz-sec-btn" style="border-color:${sec.color};color:${sec.color}" onclick="startGap(${i})">${sec.title} (${p.length})</button>`;
  });
  html+='</div>';
  document.getElementById('view-gap').innerHTML=html;
}

function startGap(idx){gapScope=idx;gapScore=0;gapTotal=0;renderGap();}

function renderGap(){
  const pool=buildGapPool(gapScope);
  if(!pool.length){document.getElementById('view-gap').innerHTML=`<div class="empty-state"><div class="icon">🤷</div>Gap topilmadi</div>`;return;}
  gapCurrent=pool[Math.floor(Math.random()*pool.length)];
  gapAnswered=false;
  const wrongs=[];
  while(wrongs.length<3&&wrongs.length<pool.length-1){
    const w=pool[Math.floor(Math.random()*pool.length)];
    if(w.answer.toLowerCase()!==gapCurrent.answer.toLowerCase()&&!wrongs.find(o=>o.answer.toLowerCase()===w.answer.toLowerCase())) wrongs.push(w);
  }
  const opts=[gapCurrent,...wrongs].sort(()=>Math.random()-.5);
  const fullEsc=gapCurrent.full.replace(/'/g,"\\'");
  document.getElementById('view-gap').innerHTML=`
    <div class="gap-wrap">
      <button class="back-btn" onclick="renderGapSelect()">← Bo'lim tanlash</button>
      <div class="quiz-score">To'g'ri: <span>${gapScore}</span> / <span>${gapTotal}</span></div>
      <div class="gap-q">
        <div class="q-label">Bo'sh joyni to'ldiring</div>
        <div class="q-uz">${gapCurrent.uz}</div>
        <div class="q-sentence">${gapCurrent.blanked}</div>
      </div>
      <div class="quiz-options">
        ${opts.map(o=>`<button class="quiz-opt" onclick="checkGap(this,${JSON.stringify(o.answer)})">${o.answer}</button>`).join('')}
      </div>
      <div class="gap-feedback" id="gap-fb"></div>
      <button class="gap-next" id="gap-next" onclick="renderGap()">Keyingi →</button>
    </div>`;
}

function checkGap(btn,chosen){
  if(gapAnswered) return;
  gapAnswered=true; gapTotal++;
  const correct=gapCurrent.answer;
  const ok=chosen.toLowerCase()===correct.toLowerCase();
  document.querySelectorAll('#view-gap .quiz-opt').forEach(b=>b.onclick=null);
  const fb=document.getElementById('gap-fb');
  if(ok){
    gapScore++; btn.classList.add('correct');
    fb.className='gap-feedback show correct';
    fb.innerHTML=`✅ To'g'ri! <b>${gapCurrent.de}</b> <button class="speak-btn" onclick="speakText('${gapCurrent.full.replace(/'/g,"\\'")}')" >🔊</button>`;
    speakText(gapCurrent.full);
  }else{
    btn.classList.add('wrong');
    document.querySelectorAll('#view-gap .quiz-opt').forEach(b=>{if(b.textContent.trim().toLowerCase()===correct.toLowerCase())b.classList.add('correct')});
    fb.className='gap-feedback show wrong';
    fb.textContent=`❌ Noto'g'ri. To'g'ri: "${correct}" (${gapCurrent.de})`;
  }
  document.querySelector('#view-gap .quiz-score').innerHTML=`To'g'ri: <span>${gapScore}</span> / <span>${gapTotal}</span>`;
  document.getElementById('gap-next').classList.add('show');
}

// STATS
function renderStats(){
  const total=flatWords.length;
  let known=0; DATA.forEach(sec=>{known+=countKnown(sec.words,sec.id)});
  const pct=total?Math.round(known/total*100):0;
  let html=`<div class="stats-wrap">
    <div class="stats-note">📌 Test va Gap to'ldirish natijalari asosida</div>
    <div class="stats-overall">
      <div class="stats-overall-label">${ALL_LEVELS[currentLevelIdx].level} — Umumiy progress</div>
      <div class="stats-overall-pct">${pct}%</div>
      <div class="stats-bar-bg"><div class="stats-bar-fill" style="width:${pct}%"></div></div>
      <div class="stats-overall-sub">${known} / ${total} so'zni bilasiz</div>
    </div>
    <div class="stats-sections">`;
  DATA.forEach(sec=>{
    const k=countKnown(sec.words,sec.id);
    const p=sec.words.length?Math.round(k/sec.words.length*100):0;
    html+=`<div class="stats-sec-card" style="background:${sec.light}">
      <div class="stats-sec-title" style="color:${sec.color}">${sec.title}</div>
      <div class="stats-bar-bg"><div class="stats-bar-fill" style="width:${p}%;background:${sec.color}"></div></div>
      <div class="stats-sec-sub" style="color:${sec.color}">${k} / ${sec.words.length} (${p}%)</div>
    </div>`;
  });
  html+=`</div><button class="stats-reset-btn" onclick="resetProg()">🗑️ Progressni tozalash</button></div>`;
  document.getElementById('view-stats').innerHTML=html;
}

function resetProg(){
  if(!confirm("Progressni tozalashni xohlaysizmi?")) return;
  knownWords.clear(); unknownWords.clear(); saveProgress(); renderStats();
}

// LIST
function renderList(filter=''){
  let html=''; let n=0;
  DATA.forEach(sec=>{
    const filtered=filter?sec.words.filter(w=>w[0].toLowerCase().includes(filter.toLowerCase())||w[1].toLowerCase().includes(filter.toLowerCase())):sec.words;
    if(!filtered.length) return;
    html+=`<div class="list-section">
      <div class="list-sec-hdr" style="background:${sec.light};color:${sec.color}">${sec.title}</div>
      ${filtered.map(w=>{n++;return `<div class="list-row">
        <div class="top-row"><span class="num">${n}</span><span class="de" style="color:${sec.color}">${w[0]}</span><span class="uz">${w[1]}</span></div>
        <div class="ex">${w[2]||''}</div>
      </div>`}).join('')}
    </div>`;
  });
  document.getElementById('view-list').innerHTML=html||`<div class="empty-state"><div class="icon">🔍</div>Natija topilmadi</div>`;
}

}
