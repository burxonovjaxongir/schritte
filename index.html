const SHEETS_URL = "https://docs.google.com/spreadsheets/d/" + SHEETS_ID + "/gviz/tq?tqx=out:json&gid=0";

let currentUser = null;

async function checkCode() {
  const inp = document.getElementById("code-input");
  const code = inp.value.trim().toUpperCase();
  if (!code) return;
  const btn = document.getElementById("login-btn");
  const loading = document.getElementById("login-loading");
  const error = document.getElementById("login-error");
  const userEl = document.getElementById("login-user");
  btn.disabled = true;
  loading.classList.add("show");
  error.classList.remove("show");
  userEl.classList.remove("show");
  try {
    const res = await fetch(SHEETS_URL + "&t=" + Date.now());
    const text = await res.text();
    const match = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/);
    if (!match) throw new Error("parse error");
    const json = JSON.parse(match[1]);
    const rows = json.table.rows;
    let found = null;
    for (const row of rows) {
      if (!row.c || !row.c[0] || !row.c[0].v) continue;
      const rowCode = String(row.c[0].v).trim().toUpperCase();
      const rowFaol = row.c[3] ? String(row.c[3].v).trim() : "TRUE";
      if (rowCode === code && rowFaol === "TRUE") {
        found = { kod: rowCode, ism: row.c[1] ? String(row.c[1].v) : "Foydalanuvchi" };
        break;
      }
    }
    if (found) {
      currentUser = found;
      localStorage.setItem("schritte_user", JSON.stringify(found));
      userEl.textContent = "Xush kelibsiz, " + found.ism + "!";
      userEl.classList.add("show");
      setTimeout(showApp, 700);
    } else {
      error.classList.add("show");
      btn.disabled = false;
    }
  } catch (e) {
    error.textContent = "Xato: " + e.message;
    error.classList.add("show");
    btn.disabled = false;
  }
  loading.classList.remove("show");
}

function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").classList.add("show");
  initApp();
}

function logout() {
  localStorage.removeItem("schritte_user");
  location.reload();
}

window.addEventListener("load", function() {
  document.getElementById("login-btn").addEventListener("click", checkCode);
  document.getElementById("code-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkCode();
  });
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("search-input").addEventListener("input", handleSearch);
  document.querySelectorAll(".mode-btn").forEach(function(b) {
    b.addEventListener("click", function() { setMode(b.dataset.mode); });
  });

  const saved = localStorage.getItem("schritte_user");
  if (saved) {
    try { currentUser = JSON.parse(saved); showApp(); } catch(e) { localStorage.removeItem("schritte_user"); }
  }
});

      flatWords.push({de:w[0], uz:w[1], ex:w[2], secId:sec.id, wordIdx:wi});
    });
  });
}

function storageKey() { return "sp_" + ALL_LEVELS[currentLevelIdx].level.replace(".",""); }

function loadProgress() {
  try {
    const raw = localStorage.getItem(storageKey());
    if (raw) {
      const obj = JSON.parse(raw);
      (obj.known||[]).forEach(function(k){knownWords.add(k)});
      (obj.unknown||[]).forEach(function(k){unknownWords.add(k)});
    }
  } catch(e) {}
}

function saveProgress() {
  try {
    localStorage.setItem(storageKey(), JSON.stringify({
      known: Array.from(knownWords), unknown: Array.from(unknownWords)
    }));
  } catch(e) {}
}

function initApp() {
  initLevelBar();
  rebuildFlat();
  loadProgress();
  document.getElementById("total-count").textContent = flatWords.length;
  renderSections();
}

const LV_CLASS = ["lt-a11","lt-a12","lt-a21","lt-a22","lt-b11","lt-b12"];

function initLevelBar() {
  const bar = document.getElementById("level-bar");
  bar.innerHTML = "";
  ALL_LEVELS.forEach(function(lv, i) {
    const total = lv.sections.reduce(function(a,s){return a+s.words.length},0);
    const b = document.createElement("button");
    b.className = "level-tab " + LV_CLASS[i] + (i===0?" active":"");
    b.innerHTML = lv.level + "<br><span style='font-size:10px;opacity:.7'>" + total + "</span>";
    b.addEventListener("click", function(){ switchLevel(i); });
    bar.appendChild(b);
  });
}

function switchLevel(idx) {
  if (idx === currentLevelIdx) return;
  saveProgress();
  currentLevelIdx = idx;
  DATA = ALL_LEVELS[idx].sections;
  knownWords = new Set(); unknownWords = new Set();
  loadProgress(); rebuildFlat();
  document.querySelectorAll(".level-tab").forEach(function(b,i){b.classList.toggle("active",i===idx)});
  document.getElementById("level-name").textContent = ALL_LEVELS[idx].level;
  document.getElementById("total-count").textContent = flatWords.length;
  quizScope=null;quizScore=0;quizTotal=0;
  gapScope=null;gapScore=0;gapTotal=0;
  currentSectionIdx=0;currentWordIdx=0;
  if(currentMode==="cards") currentMode="sections";
  setMode(currentMode);
}

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".mode-btn").forEach(function(b){b.classList.remove("active")});
  document.getElementById("btn-"+mode).classList.add("active");
  ["sections","cards","quiz","gap","list","stats"].forEach(function(m){
    document.getElementById("view-"+m).classList.remove("active");
  });
  document.getElementById("view-"+mode).classList.add("active");
  if(mode==="sections") renderSections();
  else if(mode==="cards") renderCards(currentSectionIdx,currentWordIdx);
  else if(mode==="quiz") renderQuizSelect();
  else if(mode==="gap") renderGapSelect();
  else if(mode==="stats") renderStats();
  else if(mode==="list") renderList();
}

function countKnown(words, secId) {
  let k=0;
  words.forEach(function(_,i){if(knownWords.has(secId+"_"+i))k++;});
  return k;
}

function renderSections(filter) {
  filter = filter||"";
  const q = filter.toLowerCase();
  const wrap = document.createElement("div");
  wrap.className = "sections-grid";
  DATA.forEach(function(sec,i) {
    if(q && sec.title.toLowerCase().indexOf(q)===-1 && !sec.words.some(function(w){return w[0].toLowerCase().indexOf(q)>-1||w[1].toLowerCase().indexOf(q)>-1})) return;
    const k = countKnown(sec.words, sec.id);
    const pct = sec.words.length ? Math.round(k/sec.words.length*100) : 0;
    const card = document.createElement("div");
    card.className = "sec-card";
    card.style.background = sec.light;
    card.style.borderColor = sec.color + "40";
    card.innerHTML =
      "<div class='snum' style='color:"+sec.color+"'>Bo'lim "+sec.id+"</div>" +
      "<div class='sname' style='color:"+sec.color+"'>"+sec.title+"</div>" +
      "<div class='scnt' style='color:"+sec.color+"'>"+sec.words.length+" so'z"+(k>0?" &middot; "+pct+"%":"")+"</div>" +
      "<div class='spb'><div class='spf' style='width:"+pct+"%;background:"+sec.color+"'></div></div>";
    card.addEventListener("click", function(){ openSection(i); });
    wrap.appendChild(card);
  });
  const el = document.getElementById("view-sections");
  el.innerHTML = "";
  if (wrap.children.length) el.appendChild(wrap);
  else el.innerHTML = "<div class='empty-state'><div class='icon'>&#128269;</div>Natija topilmadi</div>";
}

function openSection(i) { currentSectionIdx=i; currentWordIdx=0; setMode("cards"); }

function renderCards(si, wi) {
  currentSectionIdx=si; currentWordIdx=wi; cardRevealed=false;
  const sec=DATA[si]; const w=sec.words[wi];
  const pct=Math.round(((wi+1)/sec.words.length)*100);
  const el = document.getElementById("view-cards");
  el.innerHTML =
    "<div class='flashcard-wrap'>" +
    "<button class='back-btn' id='cards-back'>&larr; Bo'limlarga</button>" +
    "<div class='fc-sec-title'>"+sec.title+"</div>" +
    "<div class='fc-progress'><div class='fc-progress-bar'><div class='fc-progress-fill' style='width:"+pct+"%;background:"+sec.color+"'></div></div><div class='fc-progress-text'>"+(wi+1)+" / "+sec.words.length+"</div></div>" +
    "<div class='flashcard' id='flashcard' style='border-color:"+sec.color+"40'>" +
    "<div class='fc-hint'>Nemischa so'z</div>" +
    "<div class='fc-word' style='color:"+sec.color+"'>"+w[0]+"</div>" +
    "<div class='fc-sub'>"+w[1]+"</div>" +
    "<div class='fc-ex'>&#128172; \"" + w[2] + "\"</div>" +
    "<div class='fc-tap'>&#9757; Javobni ko'rish</div>" +
    "</div>" +
    "<div class='fc-result-btns' id='result-btns'>" +
    "<button class='res-btn unknown' id='btn-unknown'>&#128533; Bilmadim</button>" +
    "<button class='res-btn known' id='btn-known'>&#9989; Bildim</button>" +
    "</div>" +
    "<div class='fc-nav'>" +
    "<button class='fc-btn prev' id='btn-prev'>&larr;</button>" +
    "<button class='fc-btn flip' id='btn-flip'>&#128260; Ko'rsat</button>" +
    "<button class='fc-btn next' id='btn-next'>&rarr;</button>" +
    "</div></div>";
  document.getElementById("cards-back").addEventListener("click", function(){ setMode("sections"); });
  document.getElementById("flashcard").addEventListener("click", flipCard);
  document.getElementById("btn-flip").addEventListener("click", flipCard);
  document.getElementById("btn-unknown").addEventListener("click", function(){ markWord(false); });
  document.getElementById("btn-known").addEventListener("click", function(){ markWord(true); });
  document.getElementById("btn-prev").addEventListener("click", prevCard);
  document.getElementById("btn-next").addEventListener("click", nextCard);
}

function flipCard() {
  cardRevealed = !cardRevealed;
  document.getElementById("flashcard").classList.toggle("revealed", cardRevealed);
  document.getElementById("result-btns").classList.toggle("show", cardRevealed);
}

function markWord(known) {
  const key = DATA[currentSectionIdx].id+"_"+currentWordIdx;
  if(known){knownWords.add(key);unknownWords.delete(key);}
  else{unknownWords.add(key);knownWords.delete(key);}
  saveProgress(); nextCard();
}

function nextCard() {
  const sec=DATA[currentSectionIdx];
  if(currentWordIdx<sec.words.length-1) renderCards(currentSectionIdx,currentWordIdx+1);
  else if(currentSectionIdx<DATA.length-1) renderCards(currentSectionIdx+1,0);
  else renderCards(0,0);
}

function prevCard() {
  if(currentWordIdx>0) renderCards(currentSectionIdx,currentWordIdx-1);
  else if(currentSectionIdx>0){const p=DATA[currentSectionIdx-1];renderCards(currentSectionIdx-1,p.words.length-1);}
}

function renderQuizSelect() {
  const el = document.getElementById("view-quiz");
  el.innerHTML = "<div class='sec-select'></div>";
  const wrap = el.firstChild;
  const allBtn = document.createElement("button");
  allBtn.className = "sec-sel-btn";
  allBtn.style.borderColor = "#1E1B4B";
  allBtn.textContent = "Barcha bo'limlar (" + flatWords.length + " so'z)";
  allBtn.addEventListener("click", function(){ startQuiz(null); });
  wrap.appendChild(allBtn);
  DATA.forEach(function(sec,i){
    const b = document.createElement("button");
    b.className = "sec-sel-btn";
    b.style.borderColor = sec.color;
    b.style.color = sec.color;
    b.textContent = sec.title + " (" + sec.words.length + ")";
    b.addEventListener("click", function(){ startQuiz(i); });
    wrap.appendChild(b);
  });
}

function startQuiz(idx){quizScope=idx;quizScore=0;quizTotal=0;renderQuiz();}

function getPool(){
  if(quizScope===null) return flatWords;
  return DATA[quizScope].words.map(function(w,wi){return {de:w[0],uz:w[1],ex:w[2],secId:DATA[quizScope].id,wordIdx:wi}});
}

function renderQuiz() {
  const pool = getPool();
  const ri = Math.floor(Math.random()*pool.length);
  quizCurrentWord = pool[ri];
  const wrongs = [];
  while(wrongs.length<3 && wrongs.length<pool.length-1){
    const w=pool[Math.floor(Math.random()*pool.length)];
    if(w.uz!==quizCurrentWord.uz && !wrongs.find(function(o){return o.uz===w.uz})) wrongs.push(w);
  }
  const opts = [quizCurrentWord].concat(wrongs).sort(function(){return Math.random()-.5});
  const el = document.getElementById("view-quiz");
  el.innerHTML =
    "<div class='quiz-wrap'>" +
    "<button class='back-btn' id='quiz-back'>&larr; Bo'lim tanlash</button>" +
    "<div class='quiz-score'>To'g'ri: <span>"+quizScore+"</span> / <span>"+quizTotal+"</span></div>" +
    "<div class='quiz-q'><div class='q-label'>O'zbekchasi nima?</div><div class='q-word'>"+quizCurrentWord.de+"</div><div class='q-ex'>"+(quizCurrentWord.ex||"")+"</div></div>" +
    "<div class='quiz-options' id='quiz-opts'></div>" +
    "<button class='quiz-next' id='quiz-next'>Keyingi &rarr;</button>" +
    "</div>";
  document.getElementById("quiz-back").addEventListener("click", renderQuizSelect);
  const optsWrap = document.getElementById("quiz-opts");
  opts.forEach(function(o){
    const b = document.createElement("button");
    b.className = "quiz-opt";
    b.textContent = o.uz;
    b.addEventListener("click", function(){ checkQ(b, o.uz, quizCurrentWord.uz); });
    optsWrap.appendChild(b);
  });
  document.getElementById("quiz-next").addEventListener("click", renderQuiz);
}

function checkQ(btn, chosen, correct) {
  quizTotal++;
  document.querySelectorAll("#view-quiz .quiz-opt").forEach(function(b){b.replaceWith(b.cloneNode(true))});
  const key = quizCurrentWord.secId+"_"+quizCurrentWord.wordIdx;
  const btns = document.querySelectorAll("#view-quiz .quiz-opt");
  let matchBtn = null;
  btns.forEach(function(b){ if(b.textContent===chosen) matchBtn = b; });
  if(chosen===correct){
    if(matchBtn) matchBtn.classList.add("correct");
    quizScore++;
    knownWords.add(key); unknownWords.delete(key);
  } else {
    if(matchBtn) matchBtn.classList.add("wrong");
    unknownWords.add(key); knownWords.delete(key);
    btns.forEach(function(b){if(b.textContent===correct)b.classList.add("correct")});
  }
  saveProgress();
  document.querySelector("#view-quiz .quiz-score").innerHTML = "To'g'ri: <span>"+quizScore+"</span> / <span>"+quizTotal+"</span>";
  document.getElementById("quiz-next").classList.add("show");
}

function coreWord(de) {
  let s = de.replace(/\([^)]*\)/g,"").split(",")[0].split("/")[0].trim();
  return s.replace(/^(der|die|das|dem|den|des|sich)\s+/i,"").trim();
}

function findBlank(de, ex) {
  if(!ex) return null;
  const core = coreWord(de);
  if(!core||core.length<2) return null;
  const coreLow = core.toLowerCase();
  const tokens = ex.match(/[A-Za-z\u00C0-\u024F]+/g)||[];
  if(!tokens.length) return null;
  let match = tokens.find(function(t){return t.toLowerCase()===coreLow});
  if(!match){
    const stem = coreLow.slice(0,Math.max(3,Math.min(coreLow.length-1,5)));
    const cands = tokens.filter(function(t){return t.toLowerCase().indexOf(stem)===0 && t.length>=3});
    if(cands.length){cands.sort(function(a,b){return Math.abs(a.length-core.length)-Math.abs(b.length-core.length)});match=cands[0];}
  }
  if(!match) return null;
  const idx = ex.indexOf(match);
  if(idx===-1) return null;
  return {blanked:ex.slice(0,idx)+"<span class='gap-blank'>_____</span>"+ex.slice(idx+match.length),answer:match};
}

function buildGapPool(secIdx) {
  const src = secIdx===null ? flatWords : DATA[secIdx].words.map(function(w,wi){return {de:w[0],uz:w[1],ex:w[2],secId:DATA[secIdx].id,wordIdx:wi}});
  return src.reduce(function(pool,w){
    const r = findBlank(w.de,w.ex);
    if(r) pool.push({de:w.de,uz:w.uz,blanked:r.blanked,answer:r.answer,full:w.ex,secId:w.secId,wordIdx:w.wordIdx});
    return pool;
  },[]);
}

function speakText(text) {
  if(!("speechSynthesis" in window)||!text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="de-DE"; u.rate=0.9;
  window.speechSynthesis.speak(u);
}

function renderGapSelect() {
  const allPool = buildGapPool(null);
  const el = document.getElementById("view-gap");
  el.innerHTML = "<div class='sec-select'></div>";
  const wrap = el.firstChild;
  const allBtn = document.createElement("button");
  allBtn.className = "sec-sel-btn";
  allBtn.style.borderColor = "#1E1B4B";
  allBtn.textContent = "Barcha bo'limlar (" + allPool.length + " ta gap)";
  allBtn.addEventListener("click", function(){ startGap(null); });
  wrap.appendChild(allBtn);
  DATA.forEach(function(sec,i){
    const p = buildGapPool(i);
    if(!p.length) return;
    const b = document.createElement("button");
    b.className = "sec-sel-btn";
    b.style.borderColor = sec.color;
    b.style.color = sec.color;
    b.textContent = sec.title + " (" + p.length + ")";
    b.addEventListener("click", function(){ startGap(i); });
    wrap.appendChild(b);
  });
}

function startGap(idx){gapScope=idx;gapScore=0;gapTotal=0;renderGap();}

function renderGap() {
  const pool = buildGapPool(gapScope);
  const el = document.getElementById("view-gap");
  if(!pool.length){el.innerHTML="<div class='empty-state'><div class='icon'>&#129335;</div>Gap topilmadi</div>";return;}
  gapCurrent = pool[Math.floor(Math.random()*pool.length)];
  gapAnswered = false;
  const wrongs = [];
  while(wrongs.length<3&&wrongs.length<pool.length-1){
    const w=pool[Math.floor(Math.random()*pool.length)];
    if(w.answer.toLowerCase()!==gapCurrent.answer.toLowerCase()&&!wrongs.find(function(o){return o.answer.toLowerCase()===w.answer.toLowerCase()})) wrongs.push(w);
  }
  const opts = [gapCurrent].concat(wrongs).sort(function(){return Math.random()-.5});
  el.innerHTML =
    "<div class='gap-wrap'>" +
    "<button class='back-btn' id='gap-back'>&larr; Bo'lim tanlash</button>" +
    "<div class='quiz-score'>To'g'ri: <span>"+gapScore+"</span> / <span>"+gapTotal+"</span></div>" +
    "<div class='gap-q'>" +
    "<div class='q-label' style='text-align:center'>Bo'sh joyni to'ldiring</div>" +
    "<div class='q-uz' style='text-align:center;margin-bottom:12px'>"+gapCurrent.uz+"</div>" +
    "<div class='gap-sentence'>"+gapCurrent.blanked+"</div>" +
    "</div>" +
    "<div class='quiz-options' id='gap-opts'></div>" +
    "<div class='gap-feedback' id='gap-fb'></div>" +
    "<button class='gap-next' id='gap-next'>Keyingi &rarr;</button>" +
    "</div>";
  document.getElementById("gap-back").addEventListener("click", renderGapSelect);
  const optsWrap = document.getElementById("gap-opts");
  opts.forEach(function(o){
    const b = document.createElement("button");
    b.className = "quiz-opt";
    b.textContent = o.answer;
    b.addEventListener("click", function(){ checkGap(b, o.answer); });
    optsWrap.appendChild(b);
  });
  document.getElementById("gap-next").addEventListener("click", renderGap);
}

function checkGap(btn, chosen) {
  if(gapAnswered) return;
  gapAnswered=true; gapTotal++;
  const correct = gapCurrent.answer;
  const ok = chosen.toLowerCase()===correct.toLowerCase();
  document.querySelectorAll("#view-gap .quiz-opt").forEach(function(b){b.replaceWith(b.cloneNode(true))});
  const btns = document.querySelectorAll("#view-gap .quiz-opt");
  const fb = document.getElementById("gap-fb");
  let matchBtn = null;
  btns.forEach(function(b){ if(b.textContent===chosen) matchBtn = b; });
  if(ok){
    gapScore++; if(matchBtn) matchBtn.classList.add("correct");
    fb.className="gap-feedback show correct";
    fb.innerHTML="&#9989; To'g'ri! <b>"+gapCurrent.de+"</b> <button class='speak-btn' id='speak-btn'>&#128266;</button>";
    document.getElementById("speak-btn").addEventListener("click", function(){ speakText(gapCurrent.full); });
    speakText(gapCurrent.full);
  } else {
    if(matchBtn) matchBtn.classList.add("wrong");
    btns.forEach(function(b){if(b.textContent.toLowerCase()===correct.toLowerCase())b.classList.add("correct")});
    fb.className="gap-feedback show wrong";
    fb.textContent="Noto'g'ri. To'g'ri: \"" + correct + "\" (" + gapCurrent.de + ")";
  }
  document.querySelector("#view-gap .quiz-score").innerHTML="To'g'ri: <span>"+gapScore+"</span> / <span>"+gapTotal+"</span>";
  document.getElementById("gap-next").classList.add("show");
}

function renderStats() {
  const total = flatWords.length;
  let known = 0;
  DATA.forEach(function(sec){known+=countKnown(sec.words,sec.id)});
  const pct = total ? Math.round(known/total*100) : 0;
  const el = document.getElementById("view-stats");
  let html = "<div class='stats-wrap'>";
  html += "<div class='stats-note'>Test va Gap to'ldirish natijalari asosida</div>";
  html += "<div class='stats-overall'>";
  html += "<div class='stats-overall-label'>"+ALL_LEVELS[currentLevelIdx].level+" &mdash; Umumiy progress</div>";
  html += "<div class='stats-overall-pct'>"+pct+"%</div>";
  html += "<div class='stats-bar-bg'><div class='stats-bar-fill' style='width:"+pct+"%'></div></div>";
  html += "<div class='stats-overall-sub'>"+known+" / "+total+" so'zni bilasiz</div>";
  html += "</div>";
  html += "<div class='stats-sections'>";
  DATA.forEach(function(sec){
    const k=countKnown(sec.words,sec.id);
    const p=sec.words.length?Math.round(k/sec.words.length*100):0;
    html += "<div class='stats-sec-card' style='background:"+sec.light+"'>";
    html += "<div class='stats-sec-title' style='color:"+sec.color+"'>"+sec.title+"</div>";
    html += "<div class='stats-bar-bg'><div class='stats-bar-fill' style='width:"+p+"%;background:"+sec.color+"'></div></div>";
    html += "<div class='stats-sec-sub' style='color:"+sec.color+"'>"+k+" / "+sec.words.length+" ("+p+"%)</div>";
    html += "</div>";
  });
  html += "</div>";
  html += "<button class='stats-reset-btn' id='reset-btn'>Progressni tozalash</button>";
  html += "</div>";
  el.innerHTML = html;
  document.getElementById("reset-btn").addEventListener("click", resetProg);
}

function resetProg() {
  if(!confirm("Progressni tozalashni xohlaysizmi?")) return;
  knownWords.clear(); unknownWords.clear(); saveProgress(); renderStats();
}

function renderList(filter) {
  filter = filter||"";
  const el = document.getElementById("view-list");
  let html=""; let n=0;
  DATA.forEach(function(sec){
    const filtered = filter ? sec.words.filter(function(w){return w[0].toLowerCase().indexOf(filter.toLowerCase())>-1||w[1].toLowerCase().indexOf(filter.toLowerCase())>-1}) : sec.words;
    if(!filtered.length) return;
    html += "<div class='list-section'>";
    html += "<div class='list-sec-hdr' style='background:"+sec.light+";color:"+sec.color+"'>"+sec.title+"</div>";
    filtered.forEach(function(w){
      n++;
      html += "<div class='list-row'>";
      html += "<div class='top-row'><span class='lnum'>"+n+"</span><span class='lde' style='color:"+sec.color+"'>"+w[0]+"</span><span class='luz'>"+w[1]+"</span></div>";
      html += "<div class='lex'>"+(w[2]||"")+"</div>";
      html += "</div>";
    });
    html += "</div>";
  });
  el.innerHTML = html || "<div class='empty-state'><div class='icon'>&#128269;</div>Natija topilmadi</div>";
}

function handleSearch() {
  const q = document.getElementById("search-input").value;
  if(currentMode==="sections") renderSections(q);
  else if(currentMode==="list") renderList(q);
}
